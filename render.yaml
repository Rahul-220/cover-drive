services:
  - type: web
    name: coverdrive
    runtime: python
    plan: free
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: >
      bash -lc '
        set -euo pipefail
        echo "[start] PWD=$(pwd)"
        mkdir -p data
        if [ ! -s "data/ipl.duckdb" ]; then
          echo "[bootstrap] downloading snapshot from $DUCKDB_URL"
          curl -fL "$DUCKDB_URL" -o data/ipl.duckdb
          BYTES=$( (stat -c%s data/ipl.duckdb 2>/dev/null) || (wc -c < data/ipl.duckdb) )
          echo "[bootstrap] downloaded size: ${BYTES} bytes"
        else
          BYTES=$( (stat -c%s data/ipl.duckdb 2>/dev/null) || (wc -c < data/ipl.duckdb) )
          echo "[bootstrap] existing snapshot: ${BYTES} bytes"
        fi
        export DUCKDB_PATH=data/ipl.duckdb
        exec uvicorn backend.app:app --host 0.0.0.0 --port $PORT
      '
    envVars:
      - key: DUCKDB_URL      # paste your GitHub Release asset URL here in Render dashboard
        sync: false
      - key: GEMINI_API_KEY
        sync: false
