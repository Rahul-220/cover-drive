<!doctype html>
<html lang="en">
  <head>
    <link rel="icon" href="/static/favicon.png" type="image/png" />
    <meta charset="utf-8" />
    <title>CoverDrive</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Tailwind v3 Play CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' };</script>

    <!-- React UMD (globals) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  </head>
  <body class="bg-gray-50 dark:bg-gray-900">
    <div id="root"></div>

    <!-- Cache-bust the app script so browsers fetch the new one -->
     <script>
      // Make your API Gateway URL available globally
      window.API_BASE_URL = "https://her9vflmzj.execute-api.us-west-2.amazonaws.com";
    </script>
    <script src="static/CoverDrive.js?v=2025-09-18-3"></script>

    <script>
      (function render() {
        if (!window.CoverDrive || !window.ReactDOM) return setTimeout(render, 50);
        console.log("CoverDrive UI v2025-09-18-3");
        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(React.createElement(window.CoverDrive));
      })();
    </script>
  </body>
</html>
