<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>CoverDrive</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Tailwind v3 Play CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Important: configure via tailwind.config (not window.tailwind)
        tailwind.config = { darkMode: 'class' };
    </script>

    <!-- React UMD (globals) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  </head>
  <body class="bg-gray-50 dark:bg-gray-900">
    <div id="root"></div>

    <!-- Your app (classic script, attaches `window.CoverDrive`) -->
    <script src="/static/CoverDrive.js"></script>

    <!-- Render after everything is loaded -->
    <script>
      (function render() {
        if (!window.CoverDrive || !window.ReactDOM) {
          console.warn("Waiting for scripts...");
          return setTimeout(render, 50);
        }
        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(React.createElement(window.CoverDrive));
      })();
    </script>
  </body>
</html>
