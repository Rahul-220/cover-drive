# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  python:
    name: Python checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile key modules
        run: |
          python -m py_compile backend/app.py etl/parquet_etl.py 

      - name: Smoke import backend
        run: |
          python - <<'PY'
          import backend.app as app
          assert hasattr(app, 'app')
          print('App title:', app.app.title)
          PY

      - name: DuckDB sanity
        run: |
          python - <<'PY'
          import duckdb
          con = duckdb.connect()
          v = con.execute('select 1 as ok').fetchone()[0]
          assert v == 1
          print('DuckDB OK')
          PY

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: python
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: local/coverdrive:ci

